[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "editing-copilot"
version = "1.0.0"
description = "Bounded local editing commands for Kdenlive and DaVinci Resolve"
requires-python = ">=3.12"
dependencies = ["pywin32==311; sys_platform == 'win32'", "vosk>=0.3.45", "sounddevice>=0.4.6", "numpy>=1.26", "pywinauto>=0.6.8; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'", "pillow>=10", "rapidocr-onnxruntime>=1.3"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
editing-copilot = "editing_copilot.__main__:main"

[tool.setuptools.package-data]
editing_copilot = []

[tool.setuptools.packages.find]
where = ["src"]
